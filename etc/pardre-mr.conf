# Avoid merging output files (mergeOutput=false) involves 
# that temporary intermediate files are not deleted 
# (i.e., deleteTemp=false)
mergeOutput=true
deleteTemp=true
pairedJoin=false
# Requires snappy library installed and the Hadoop native
# native library compiled with snappy support
compressTemp=true
# The buffer size used for input read operations. It should 
# probably be a multiple of hardware page size (e.g., 4096)
ioBufferSize=65536
