# Avoid merging output files (mergeOutput=false) involves 
# that temporary intermediate files are not deleted 
# (i.e., deleteTemp=false)
mergeOutput=true
# Delete intermediate files
deleteTemp=true
# Enable the use of the map-side join in paired-end mode
pairedJoin=false
# Enable snappy compression of intermediate files. It 
# requires the snappy library installed on the system  and
# the Hadoop native library compiled with snappy support
compressTemp=false
# The buffer size in bytes that is used for input read 
# operations. It should probably be a multiple of the 
# hardware page size (e.g., 4096)
ioBufferSize=65536
# Enable the use of the in-Mapper combiner
inMapperCombiner=true
